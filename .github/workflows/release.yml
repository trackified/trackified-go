name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - run: go test -race -count=1 ./...
      - name: Source archive
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="trackified-go-${GITHUB_REF_NAME}/" -o "dist/trackified-go-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
      # Go modules are published by the tag itself; this asks the proxy to fetch it so pkg.go.dev lists it.
      - name: Warm the Go module proxy
        working-directory: ${{ runner.temp }}
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
